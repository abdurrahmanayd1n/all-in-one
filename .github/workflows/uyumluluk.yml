# Builds, self-tests and starts the app on an older and a current Windows. GitHub offers no desktop Windows 10;
# Windows Server 2022 (build 20348) is the nearest, older than Windows 11.
name: Uyumluluk
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  sina:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Derle ve oz test
        shell: powershell
        run: .\kur.ps1 -Derle
      # Shown as an annotation on the run's page, which can be read without signing in.
      - name: Basarisiz kontrolu bul
        if: failure()
        shell: powershell
        run: |
          $found = @(Get-Content "$env:TEMP\AllInOne-test.txt" -Encoding UTF8 -ErrorAction SilentlyContinue)
          # A native crash is told by Windows alone: which module, which error.
          Start-Sleep -Seconds 3
          $found += @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'Application Error', '.NET Runtime'; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
              Select-Object -First 2 | ForEach-Object { $_.Message -split "`r?`n" | Select-Object -First 14 })
          $found += @(.\.github\hata-satiri.ps1 | ForEach-Object { "$_" })
          $found
          "::error::" + (($found | Select-Object -First 60) -join '%0A')
          # The stack at the moment of a native crash, when the debugger is there.
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (Test-Path $cdb) {
              $trace = @(".lastevent", "kc 45", "q" | & $cdb -g -G bin\AllInOne.exe --test 2>&1 | ForEach-Object { "$_" })
              "::error::" + (($trace | Select-Object -Last 60) -join '%0A')
          } else { "::error::hata ayiklayici yok" }
      - name: Uygulamayi ac, ayakta kaldigini ve hata yazmadigini dogrula
        shell: powershell
        run: |
          "Windows yapisi: $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuildNumber)"
          $file = "$env:LOCALAPPDATA\AllInOne\hata.log"
          Remove-Item $file -ErrorAction SilentlyContinue
          $app = Start-Process bin\AllInOne.exe -PassThru
          Start-Sleep -Seconds 20
          $log = @(Get-Content $file -Encoding UTF8 -ErrorAction SilentlyContinue)
          $log
          if ($app.HasExited) { throw "Uygulama kapandi: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          if ($log.Count -eq 0) { throw 'Uygulama kayit yazmadi, baslamamis olabilir.' }
          if ($log -match 'HATA') { throw 'Hata kaydinda sorun var.' }
